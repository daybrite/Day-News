[package]
name = "daynews-credentials"
version.workspace = true
edition = "2024"
license = "Apache-2.0"

[dependencies]
day-bridge = { git = "https://github.com/daybrite/day.git" }

[target.'cfg(any(target_os = "macos", target_os = "ios"))'.dependencies]
keyring = { version = "3.6", features = ["apple-native"] }

[target.'cfg(target_os = "windows")'.dependencies]
keyring = { version = "3.6", features = ["windows-native"] }

[target.'cfg(all(target_os = "linux", not(target_env = "ohos")))'.dependencies]
keyring = { version = "3.6", features = ["async-secret-service", "async-io", "crypto-rust"] }

[build-dependencies]
day-build = { git = "https://github.com/daybrite/day.git" }

[target.'cfg(target_os = "android")'.dependencies]
day-mdc = { git = "https://github.com/daybrite/day.git" }
day-android-runtime = { git = "https://github.com/daybrite/day.git" }
