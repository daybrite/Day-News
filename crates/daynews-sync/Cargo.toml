[package]
name = "daynews-sync"
version.workspace = true
edition = "2024"
license = "Apache-2.0"

[dependencies]
day-part-http = { git = "https://github.com/daybrite/day.git" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
futures-util = "0.3"
url = "2"
chrono = { version = "0.4", default-features = false, features = ["std"] }
httpdate = "1"
