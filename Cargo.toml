[package]
name = "day-news"
version.workspace = true
edition = "2024"
license = "Apache-2.0"
# Generates typed resource constants (`res::images::…`, `res::assets::…`, `res::fonts::…`) from the
# files under `resource/` on every build; see build.rs and src/lib.rs (§18.5).
build = "build.rs"

[features]
# The default `mock` backend lets a bare `cargo build` / rust-analyzer compile out of the box;
# `day build` always passes `--no-default-features --features <backend>`, stripping it.
default = ["mock"]
appkit = ["day/appkit", "day-piece-webview/appkit"]
gtk = ["day/gtk", "day-piece-webview/gtk"]
qt = ["day/qt", "day-piece-webview/qt"]
uikit = ["day/uikit", "day-piece-webview/uikit"]
material = ["day/material", "day-piece-webview/material"]
xaml = ["day/xaml", "day-piece-webview/xaml"]
winui = ["day/winui", "day-piece-webview/winui"]
arkui = ["day/arkui", "day-piece-webview/arkui"]
dom = ["day/dom", "day-piece-webview/dom"]
# day-piece-webview ships no mock renderer, so the headless default omits it.
mock = ["day/mock"]

# rlib for the desktop bin; the mobile pipeline requests the iOS staticlib / Android cdylib
# explicitly via `cargo rustc --crate-type`.
[lib]
# A fixed name, not the package's. Every artifact Day stages is named after the `[lib]` target
# (`libdayapp.a` for the iOS/macOS staticlib, `libdayapp.so` for the Android cdylib, and the
# `dayapp::` path `src/main.rs` imports), so none of them move when the package is renamed.
# Renaming this app is a one-line edit to `[package] name` above (DESIGN.md §17.5).
name = "dayapp"
crate-type = ["rlib"]

[dependencies]
day-piece-charts = "0.4"
day-core = "0.6"
day-spec = "0.6"
serde_json = "1"
serde = { version = "1", features = ["derive"] }
url = "2"
encoding_rs = "0.8"
futures-util = "0.3"
day-async = "0.6"
html5ever = "0.39"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "ico", "webp"] }
day-part-http = "0.6"
day-piece-settings = "0.6"
day = { package = "day-app", version = "0.6", features = ["model"] }
day-piece-webview = "0.4"
daynews-feed = { path = "crates/daynews-feed" }
daynews-core = { path = "crates/daynews-core" }
daynews-sync = { path = "crates/daynews-sync" }
daynews-time = { path = "crates/daynews-time" }
daynews-db = { path = "crates/daynews-db" }
daynews-opml = { path = "crates/daynews-opml" }

[build-dependencies]
day-build = "0.6"


[workspace]
resolver = "2"
members = [
    ".",
    "crates/daynews-core",
    "crates/daynews-db",
    "crates/daynews-feed",
    "crates/daynews-opml",
    "crates/daynews-time",
    "crates/daynews-sync",
    "crates/daynews-credentials",
]

[workspace.package]
version = "0.2.1"

# The bundled SQLite is C compiled by its build script at the profile's optimization level, and
# unoptimized it runs the dashboard's word count and full-text searches about seven times slower
# (2.6 s rather than 0.4 s for a large library's word cloud). Optimize it alone in debug builds;
# the app's own code keeps fast, debuggable compiles.
[profile.dev.package.libsqlite3-sys]
opt-level = 3
