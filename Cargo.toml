[package]
name = "day-news"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
# Generates typed resource constants (`res::images::…`, `res::assets::…`, `res::fonts::…`) from the
# files under `resource/` on every build — see build.rs and src/lib.rs (§18.5).
build = "build.rs"

[features]
# The default `mock` backend lets a bare `cargo build` / rust-analyzer compile out of the box;
# `day build` always passes `--no-default-features --features <backend>`, stripping it.
default = ["mock"]
appkit = ["day/appkit", "day-piece-webview/appkit"]
gtk = ["day/gtk", "day-piece-webview/gtk"]
qt = ["day/qt", "day-piece-webview/qt"]
uikit = ["day/uikit", "day-piece-webview/uikit"]
mdc = ["day/mdc", "day-piece-webview/mdc"]
xaml = ["day/xaml", "day-piece-webview/xaml"]
arkui = ["day/arkui", "day-piece-webview/arkui"]
dom = ["day/dom", "day-piece-webview/dom"]
# day-piece-webview ships no mock renderer, so the headless default omits it.
mock = ["day/mock"]

# rlib for the desktop bin; the mobile pipeline requests the iOS staticlib / Android cdylib
# explicitly via `cargo rustc --crate-type` (a desktop cdylib blows past the windows-gnu PE
# export cap).
[lib]
# A CONSTANT name, not the package's. Every artifact Day stages is named after the LIB target —
# `libdayapp.a` for the iOS/macOS staticlib, `libdayapp.so` for the Android cdylib, and the
# `dayapp::` path `src/main.rs` imports — so none of them move when the package is renamed.
# Renaming this app is a one-line edit to `[package] name` above (DESIGN.md §17.5).
name = "dayapp"
crate-type = ["rlib"]

[dependencies]
day = { git = "https://github.com/daybrite/day.git", features = ["persistence"] }
# The article reader renders feed HTML in a native web view (docs/webview.md).
day-piece-webview = { git = "https://github.com/daybrite/day.git" }
daynews-core = { path = "crates/daynews-core" }
daynews-db = { path = "crates/daynews-db" }
daynews-opml = { path = "crates/daynews-opml" }

[build-dependencies]
day-build = { git = "https://github.com/daybrite/day.git" }


[workspace]
resolver = "2"
members = [
    ".",
    "crates/daynews-core",
    "crates/daynews-db",
    "crates/daynews-feed",
    "crates/daynews-opml",
]
