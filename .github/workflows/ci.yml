name: ci

on:
  push:
    branches: ["**"]
    tags: ["v[0-9]+.[0-9]+.[0-9]+*"]
  workflow_dispatch:
  schedule:
    - cron: "0 18 * * *" # daily (UTC)

permissions:
  contents: write # release-asset upload on tag builds
  pages: write    # web-dom → GitHub Pages (deploy-web)
  id-token: write # deploy-pages OIDC token (deploy-web)

jobs:
  app:
    uses: daybrite/actions/.github/workflows/build-day-app.yml@main
    secrets: inherit
    with:
      targets: windows-xaml, macos-appkit, linux-gtk, linux-qt, ios-uikit, android-mdc, harmony-arkui, web-dom
      day-version: main
      scripts: dayscript/seed-fixtures.yaml dayscript/walkthrough.yaml
      locales: en
      # Two form factors on iOS and Android, each its own job, screenshot artifact and gallery
      # column: the reader is three panes side by side on a tablet and three pushed screens on
      # a phone, so the gallery should show both. The same profiles Day-Rise and Day-Showcase
      # run. `device` is a name PREFIX on iOS (runner images retire exact device names) and an
      # exact `avdmanager list device` id on Android; the first profile stays primary (it packs
      # and keeps the plain screenshots-<target> artifact), the second uploads
      # screenshots-<target>-<slug>.
      ios-devices: |
        device=iPhone,           orientation=portrait
        device=iPad Pro 13-inch, orientation=landscape, slug=ipad
      android-devices: |
        device=pixel_5,      os=36, orientation=portrait
        device=pixel_tablet, os=36, orientation=landscape, slug=tablet
      deploy-web: true
      daysite-version: main

