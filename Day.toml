# Day.toml — the Day project manifest (https://daybrite.dev/docs/cli).
#
# `name` and `version` come from Cargo.toml's [package] — they are never restated here.
# Any [app] property can be overridden per platform ([app.ios]), per toolkit ([app.qt]),
# or per target ([app.macos-appkit]); the most specific table wins.
schema = 1

[app]
id = "dev.daybrite.sheets"
# The deep-link scheme this app SHIPPED (docs/deep-links.md). Left explicit because the
# default is the id\'s last segment, which is not what this app published.
scheme = "daysheets"
title = "Day News"
build = 1
targets = ["macos-appkit", "macos-gtk", "macos-qt", "windows-xaml", "ios-uikit", "android-mdc", "web-dom"]

[window]
width = 1440
height = 900
