# Imports a sample subscription list through the real file picker, then refreshes every feed.
#
# The OPML is a REPOSITORY fixture (`${project}` is expanded by the CLI to the checkout's
# path), so this runs on any machine and on CI — test resources must never live outside the
# repo. It lists the live originals of the bundled fixture feeds, in folders, and is the same
# file the daynews-opml unit tests parse; crates/daynews-opml/tests/data/README.md describes it.
#
# CONTRACT: expects a store that does not already hold these 7 subscriptions — the count
# below is the whole sidebar, not just the import. Re-running is otherwise safe: feed ids are
# a hash of the feed URL, so importing twice adds nothing the second time.
name: day-news-import
description: Import an OPML file through the real file picker and refresh every feed.
flow:
  - wait_for: { id: nav }
  - navigate: { route: subscriptions }
  - wait_for: { id: opml-import }
  - tap: { id: opml-import }
  - pause: { secs: 1 }
  - respond:
      { path: "${project}/crates/daynews-opml/tests/data/daynews.opml" }
  - pause: { secs: 2 }
  - assert_text: { id: feeds-count, text: "7 feeds" }
  - screenshot: imported
