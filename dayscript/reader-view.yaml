# Start tests/reader-view-server.py and launch with a fresh isolated DAY_DATA_DIR.
name: day-news-reader-view
description: Local full-text extraction, cached toggling, selection cancellation, and errors.
flow:
  - dialog_mode: { mode: scripted }
  - toolbar: { item: new_feed }
  - wait_for: { id: feed_url }
  - input: { id: feed_url, text: 'http://127.0.0.1:28761/error-feed.json' }
  - tap: { id: feed_verify }
  - tap: { id: feed_subscribe }
  - pause: { secs: 2 }
  - toolbar: { item: feed_overview, only_on: [ios-uikit, android-material, harmony-arkui] }
  - wait_for: { id: feed_auto_reader }
  - toggle: { id: feed_auto_reader, value: false }
  - navigate: { route: all }
  - wait_for: { id: article_row:0 }
  - select: { id: timeline, index: 0 }
  - pause: { secs: 1 }
  - menu: { id: reader_view, only_on: [macos-appkit] }
  - toolbar: { item: reader_view, on: true, skip_on: [macos-appkit] }
  - pause: { secs: 2 }
  - web_eval: { id: reader_web, script: 'document.body.textContent', contains: 'Full publication content.' }
  - web_eval: { id: reader_web, script: 'Boolean(window.publisherScriptRan)', text: 'false' }
  - web_eval: { id: reader_web, script: "(() => { const a = document.querySelector('a[href$=\"/reference\"]'); a.dispatchEvent(new PointerEvent('pointermove', {bubbles: true, pointerType: 'mouse', clientX: 100, clientY: 150})); return document.getElementById('reader-link-tooltip').textContent; })()", text: 'http://127.0.0.1:28761/reference' }
  - screenshot: reader-full-link-tooltip
  - screenshot: reader-view-full-article
  - toolbar: { item: reader_view, on: false }
  - pause: { secs: 1 }
  - web_eval: { id: reader_web, script: 'document.body.textContent', contains: 'RSS excerpt for complete.' }
  - web_eval: { id: reader_web, script: "(() => { const a = document.querySelector('a[href$=\"/reference\"]'); a.dispatchEvent(new PointerEvent('pointermove', {bubbles: true, pointerType: 'mouse', clientX: 100, clientY: 150})); return document.getElementById('reader-link-tooltip').textContent; })()", text: 'http://127.0.0.1:28761/reference' }
  - screenshot: reader-feed-link-tooltip
  - toolbar: { item: reader_view, on: true }
  - pause: { secs: 1 }
  - web_eval: { id: reader_web, script: 'document.body.textContent', contains: 'Full publication content.' }
  - navigate: { route: all }
  - select: { id: timeline, index: 1 }
  - pause: { secs: 1 }
  - toolbar: { item: reader_view, on: true }
  - web_eval: { id: reader_web, script: 'document.getElementById("reader-load-full").getAttribute("aria-busy")', text: 'true' }
  - navigate: { route: all }
  - select: { id: timeline, index: 0 }
  - pause: { secs: 5 }
  - web_eval: { id: reader_web, script: 'document.body.textContent', contains: 'RSS excerpt for complete.' }
  - navigate: { route: all }
  - select: { id: timeline, index: 2 }
  - pause: { secs: 1 }
  - toolbar: { item: reader_view, on: true }
  - pause: { secs: 1 }
  - web_eval: { id: reader_web, script: 'document.getElementById("reader-load-error").hidden', text: 'false' }
  - web_eval: { id: reader_web, script: 'document.getElementById("reader-load-error").title', contains: 'Couldn’t load the full article.' }
  - web_eval: { id: reader_web, script: 'document.getElementById("reader-load-error").click(); "clicked"', text: 'clicked' }
  - assert_presented: { title: 'Couldn’t Load Full Article' }
  - respond: { button: 0 }
  - web_eval: { id: reader_web, script: 'document.body.textContent', contains: 'RSS excerpt for denied.' }
  - screenshot: reader-view-error
  # A long preview catches viewport resizing, scroll jumps and load-box movement on failure.
  - navigate: { route: all }
  - select: { id: timeline, index: 3 }
  - pause: { secs: 1 }
  - web_eval: { id: reader_web, script: 'document.getElementById("reader-load-full").scrollIntoView({block:"center"}); "scrolled"', text: 'scrolled' }
  - web_eval: { id: reader_web, script: 'window.errorGeometry = [innerHeight, scrollY, document.getElementById("reader-load-control").getBoundingClientRect().top, document.getElementById("reader-load-control").offsetHeight]; scrollY > 0', text: 'true' }
  - toolbar: { item: reader_view, on: true }
  - web_eval: { id: reader_web, script: 'document.getElementById("reader-load-error").title', contains: 'No readable article was found.' }
  - web_eval: { id: reader_web, script: '[innerHeight, scrollY, document.getElementById("reader-load-control").getBoundingClientRect().top, document.getElementById("reader-load-control").offsetHeight].every((value, index) => Math.abs(value - window.errorGeometry[index]) < 2)', text: 'true' }
  - screenshot: reader-no-content-warning
  - web_eval: { id: reader_web, script: 'document.getElementById("reader-load-error").click(); "clicked"', text: 'clicked' }
  - assert_presented: { title: 'Couldn’t Load Full Article' }
  - respond: { button: 0 }
  - web_eval: { id: reader_web, script: 'document.getElementById("reader-load-full").click(); "clicked"', text: 'clicked' }
  - web_eval: { id: reader_web, script: 'document.getElementById("reader-load-error").hidden', text: 'true' }
  - web_eval: { id: reader_web, script: 'document.getElementById("reader-load-error").title', contains: 'No readable article was found.' }
  - navigate: { route: all }
  - select: { id: timeline, index: 0 }
  - pause: { secs: 1 }
  - web_eval: { id: reader_web, script: 'document.getElementById("reader-load-error").hidden', text: 'true' }
  - dialog_mode: { mode: native }
