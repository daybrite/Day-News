# Start tests/reader-view-server.py and launch with a fresh isolated DAY_NEWS_DATA_DIR.
name: day-news-reader-view
description: Local full-text extraction, cached toggling, selection cancellation, and errors.
flow:
  - dialog_mode: { mode: scripted }
  - toolbar: { item: new-feed }
  - wait_for: { id: feed-url }
  - input: { id: feed-url, text: 'http://127.0.0.1:28761/feed.json' }
  - tap: { id: feed-verify }
  - tap: { id: feed-subscribe }
  - pause: { secs: 2 }
  - toolbar: { item: feed-overview, only_on: [ios-uikit, android-mdc, harmony-arkui] }
  - wait_for: { id: feed-auto-reader }
  - toggle: { id: feed-auto-reader, value: false }
  - navigate: { route: all }
  - wait_for: { id: article-row-0 }
  - select: { id: timeline, index: 0 }
  - pause: { secs: 1 }
  - menu: { id: reader-view, only_on: [macos-appkit] }
  - toolbar: { item: reader-view, on: true, skip_on: [macos-appkit] }
  - pause: { secs: 2 }
  - web_eval: { id: reader-web, script: 'document.body.textContent', contains: 'Full publication content.' }
  - web_eval: { id: reader-web, script: 'Boolean(window.publisherScriptRan)', text: 'false' }
  - web_eval: { id: reader-web, script: "(() => { const a = document.querySelector('a[href$=\"/reference\"]'); a.dispatchEvent(new PointerEvent('pointermove', {bubbles: true, pointerType: 'mouse', clientX: 100, clientY: 150})); return document.getElementById('reader-link-tooltip').textContent; })()", text: 'http://127.0.0.1:28761/reference' }
  - screenshot: reader-full-link-tooltip
  - screenshot: reader-view-full-article
  - toolbar: { item: reader-view, on: false }
  - pause: { secs: 1 }
  - web_eval: { id: reader-web, script: 'document.body.textContent', contains: 'RSS excerpt for complete.' }
  - web_eval: { id: reader-web, script: "(() => { const a = document.querySelector('a[href$=\"/reference\"]'); a.dispatchEvent(new PointerEvent('pointermove', {bubbles: true, pointerType: 'mouse', clientX: 100, clientY: 150})); return document.getElementById('reader-link-tooltip').textContent; })()", text: 'http://127.0.0.1:28761/reference' }
  - screenshot: reader-feed-link-tooltip
  - toolbar: { item: reader-view, on: true }
  - pause: { secs: 1 }
  - web_eval: { id: reader-web, script: 'document.body.textContent', contains: 'Full publication content.' }
  - navigate: { route: all }
  - select: { id: timeline, index: 1 }
  - pause: { secs: 1 }
  - toolbar: { item: reader-view, on: true }
  - assert_missing: { id: reader-view-status }
  - web_eval: { id: reader-web, script: 'document.getElementById("reader-load-full").getAttribute("aria-busy")', text: 'true' }
  - navigate: { route: all }
  - select: { id: timeline, index: 0 }
  - pause: { secs: 5 }
  - web_eval: { id: reader-web, script: 'document.body.textContent', contains: 'RSS excerpt for complete.' }
  - assert_missing: { id: reader-view-status }
  - navigate: { route: all }
  - select: { id: timeline, index: 2 }
  - pause: { secs: 1 }
  - toolbar: { item: reader-view, on: true }
  - pause: { secs: 1 }
  - assert_text: { id: reader-view-status, key: reader_view_network_error }
  - web_eval: { id: reader-web, script: 'document.body.textContent', contains: 'RSS excerpt for denied.' }
  - screenshot: reader-view-error
  - dialog_mode: { mode: native }
