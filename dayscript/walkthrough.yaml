# Day News walkthrough: the reader loop end to end against the imported subscriptions.
#
#     day launch -p macos-appkit --script dayscript/walkthrough.yaml
#
# CONTRACT: expects the store to already hold subscriptions with articles (run
# dayscript/seed-demo.yaml first, as CI does). Written to be re-runnable: it reads from
# "All Articles", which is unaffected by the read state a previous run left behind, and only
# asserts emptiness in the unread scope where it has just marked everything read itself.
name: day-news-walkthrough
description: Sidebar, timeline, reader, search, and read/unread marking.
flow:
  - wait_for: { id: nav }
  - screenshot: sidebar

  # All Articles: present regardless of what an earlier run marked read.
  - navigate: { route: all }
  - wait_for: { id: article-row-0, timeout_secs: 20 }
  - screenshot: timeline

  # Search filters through the full-text index, then clears. It is a toolbar item on the
  # desktops and a timeline field on a phone (docs/toolbars.md): one behavior, two homes.
  # "moon" hits several of the seeded demo feeds (Field Notes, Night Sky, Word of the Day,
  # Almanac), so the results shot has rows from more than one subscription. The English set is
  # the only one so far; a second language needs a localized term here (`key:`), which
  # resource/assets/demo/README.md describes.
  # The search is the nav host's `.searchable()` field, driven through the toolbar MODEL
  # (day-core's, one for every toolkit) rather than through whatever draws it: the desktops'
  # window toolbar, the phones' navigation bar (iOS) or docked bar (Android), and on HarmonyOS
  # the navigation title's menus (`Cap::Toolbar` Emulated since 2026-09). The app hides its
  # inline field wherever a bar exists, HarmonyOS included, so the model is the one path that
  # holds everywhere; the HarmonyOS-only `input: search` branch this had asserted a field that
  # no longer exists there.
  - toolbar: { item: day.search, text: "moon" }
  - pause: { secs: 1 }
  - screenshot: search-results
  - toolbar: { item: day.search, text: "" }
  - pause: { secs: 1 }
  - wait_for: { id: article-row-0, timeout_secs: 10 }

  # Opening an article: the native list reports the selection, and selection opens; the
  # reader renders it in the web view (and marks it read). `select:` feeds the same event
  # the platform table emits for a click or an arrow step.
  - select: { id: timeline, index: 0 }
  - pause: { secs: 2 }
  # macos-gtk has no WebKitGTK build, so the reader composes the article from pieces there rather
  # than realizing day's placeholder leaf (docs/webview.md): the same reader, drawn differently.
  - assert_visible: { id: reader-web, skip_on: [macos-gtk] }
  - assert_visible: { id: reader-text, only_on: [macos-gtk] }
  # ...and that it rendered: `assert_visible` only proves the native view exists; an
  # error page or a blank document would pass it (and did, when Android's WebView refused
  # file:// URLs). The reader document stamps its title with id="reader-title"; asking the
  # live page for it proves real content, on the backends whose eval arm exists
  # (docs/webview-eval.md; gtk has no arm, web-dom's iframe can never have one). HarmonyOS is
  # off the list although its arm exists: CI's Oniro image is x86_64 and its ArkWeb ships
  # arm64-only native libraries, so the web engine never loads there and an eval waits forever
  # (docs/harmonyos.md); the view itself exists, which the assertion above still proves.
  - web_eval:
      id: reader-web
      script: "document.getElementById('reader-title') ? 'reader-ok' : 'no-title'"
      text: "reader-ok"
      only_on: [macos-appkit, ios-uikit, macos-qt, android-mdc]
  - screenshot: article

  # Selection walks and the reader follows (docs/list.md): the native table owns the arrow
  # keys; this drives the same selection event programmatically. Desktop-only to keep the
  # phones' push-navigation flow linear.
  - select: { id: timeline, index: 1, skip_on: [ios-uikit, android-mdc, harmony-arkui] }
  - pause: { secs: 1 }
  - screenshot: keyboard-next
  - select: { id: timeline, index: 0, skip_on: [ios-uikit, android-mdc, harmony-arkui] }
  - pause: { secs: 1 }

  # Read/unread toggling: the row's trailing swipe action, the toolbar toggle, and the
  # Article menu item all flip the same flag. Three toggles net one flip, leaving row 0
  # unread, which the mark-all-read step below depends on (it fails disabled over an
  # all-read store). The swipe drives the toggle on every platform (native reveal on
  # macOS/iOS; the other toolkits show no affordance but share the wiring); the toolbar and
  # menu flips below are desktop-only, so on a phone the swipe's single flip is what
  # guarantees the unread row the mark-all-read step needs. `key:` pins which button the
  # offer held: the row was just opened, so it must say Mark as Unread.
  # Android first steps back out of the reader. On a phone its composed push swaps the
  # timeline out of the tree while the reader shows (iOS and HarmonyOS keep both in their
  # native stacks; the desktops keep the panes side by side). On a tablet the reader sits
  # beside the timeline, and the same back closes it without leaving the section. `nav_back`
  # is the app bar's arrow and the system back, the same route out a finger takes.
  - nav_back: { native: true, only_on: [android-mdc] }
  - pause: { secs: 1, only_on: [android-mdc] }
  - swipe_row: { id: timeline, row: 0, key: mark_unread }
  - pause: { secs: 1 }
  - toolbar: { item: read, on: true, skip_on: [ios-uikit, android-mdc, harmony-arkui] }
  - pause: { secs: 1 }
  - menu: { key: toggle_read, path: [menu_article], skip_on: [ios-uikit, android-mdc, harmony-arkui] }
  - pause: { secs: 1 }

  # The leading edge stars, and its label is state-dependent too: star, then unstar. The
  # pair proves the dynamic offer and leaves the store unchanged for the next run.
  - swipe_row: { id: timeline, row: 0, edge: leading, key: star }
  - pause: { secs: 1 }
  - swipe_row: { id: timeline, row: 0, edge: leading, key: unstar }
  - pause: { secs: 1 }

  # Article ▸ Mark as Unread guarantees the unread scope below is non-empty even when a
  # previous run left everything read; mark-all-read would otherwise sit disabled.
  - menu: { key: menu_mark_unread, path: [menu_article], skip_on: [ios-uikit, android-mdc, harmony-arkui] }

  # Mark-all-read empties the unread timeline specifically.
  - navigate: { route: unread }
  - pause: { secs: 1 }
  # Mark All as Read is a toolbar item everywhere: every toolkit has somewhere to draw a
  # contribution (docs/toolbars.md), HarmonyOS's being the title-bar menus, and the step drives
  # the model, so the inline button the app keeps for a bar-less toolkit is never what is
  # pressed here.
  - toolbar: { item: mark-all-read }
  - pause: { secs: 1 }
  - assert_visible: { id: timeline-empty }
  - screenshot: all-read

  # Tag the open article through the Article menu (the prompt is scripted); the tag then
  # scopes the timeline. The route id is the tag name's deterministic hash
  # (daynews_db::tag_id("keep"), stable across runs and machines).
  - navigate: { route: all }
  - wait_for: { id: article-row-0, timeout_secs: 10 }
  - select: { id: timeline, index: 0 }
  - pause: { secs: 1 }
  - menu: { key: menu_tag, path: [menu_article], skip_on: [ios-uikit, android-mdc, harmony-arkui] }
  - respond: { text: "keep", skip_on: [ios-uikit, android-mdc, harmony-arkui] }
  - pause: { secs: 1 }
  - navigate: { route: "tag:6648694386267937070", skip_on: [ios-uikit, android-mdc, harmony-arkui] }
  - pause: { secs: 1 }
  - assert_text: { id: scope-title, text: "keep", skip_on: [ios-uikit, android-mdc, harmony-arkui] }
  - wait_for: { id: article-row-0, skip_on: [ios-uikit, android-mdc, harmony-arkui] }
  - screenshot: tag-scope

  # Untag from inside the tag scope: the row leaves the live tag timeline on the spot, and
  # the store returns to untagged so the tag steps above repeat cleanly on the next run.
  # (An aborted run can strand the tag applied; the run after that untags and fails once.)
  - select: { id: timeline, index: 0, skip_on: [ios-uikit, android-mdc, harmony-arkui] }
  - pause: { secs: 1 }
  - menu: { key: menu_tag, path: [menu_article], skip_on: [ios-uikit, android-mdc, harmony-arkui] }
  - respond: { text: "keep", skip_on: [ios-uikit, android-mdc, harmony-arkui] }
  - pause: { secs: 1 }
  - assert_visible: { id: timeline-empty, skip_on: [ios-uikit, android-mdc, harmony-arkui] }

  # Settings: the retention picker is present and live.
  - navigate: { route: settings }
  - wait_for: { id: retention-picker }
  - screenshot: settings

  # The toolbar's sidebar toggle hides the pane and brings it back.
  - toolbar: { item: day.sidebar-toggle, skip_on: [ios-uikit, android-mdc, harmony-arkui] }
  - pause: { secs: 1 }
  - screenshot: sidebar-hidden
  - toolbar: { item: day.sidebar-toggle, skip_on: [ios-uikit, android-mdc, harmony-arkui] }
  - pause: { secs: 1 }

  # Feed ▸ Refresh Feed, Mark All as Read and Unsubscribe act on the feed the sidebar has
  # selected: the same three daynews-core calls every feed row's context menu makes. `menu:`
  # drives the app menu, which the phones do not have, so they skip this block. Kitchen Science
  # refreshes from the bundle, so no network is involved. Its route id is the URL's deterministic
  # hash (daynews_db::feed_id("asset:demo/kitchen-science.xml")).
  - navigate: { route: "feed:9105033381806695217", skip_on: [ios-uikit, android-mdc, harmony-arkui] }
  - wait_for: { id: article-row-0, skip_on: [ios-uikit, android-mdc, harmony-arkui] }
  - menu: { key: menu_refresh_feed, path: [menu_feed], skip_on: [ios-uikit, android-mdc, harmony-arkui] }
  - pause: { secs: 1, skip_on: [ios-uikit, android-mdc, harmony-arkui] }
  - menu: { key: mark_all_read, path: [menu_feed], skip_on: [ios-uikit, android-mdc, harmony-arkui] }
  - pause: { secs: 1, skip_on: [ios-uikit, android-mdc, harmony-arkui] }
  - menu: { key: unsubscribe, path: [menu_feed], skip_on: [ios-uikit, android-mdc, harmony-arkui] }
  - pause: { secs: 1, skip_on: [ios-uikit, android-mdc, harmony-arkui] }
  - navigate: { route: subscriptions, skip_on: [ios-uikit, android-mdc, harmony-arkui] }
  - wait_for: { id: feeds-count, skip_on: [ios-uikit, android-mdc, harmony-arkui] }
  - assert_text: { id: feeds-count, key: feeds_count, args: { count: 6 }, skip_on: [ios-uikit, android-mdc, harmony-arkui] }
  # Subscribe again, so the screenshots below and the next run see all seven feeds.
  - input: { id: subscribe-url, text: "asset:demo/kitchen-science.xml", skip_on: [ios-uikit, android-mdc, harmony-arkui] }
  - tap: { id: subscribe-add, skip_on: [ios-uikit, android-mdc, harmony-arkui] }
  - pause: { secs: 2, skip_on: [ios-uikit, android-mdc, harmony-arkui] }
  - assert_text: { id: feeds-count, key: feeds_count, args: { count: 7 }, skip_on: [ios-uikit, android-mdc, harmony-arkui] }

  # Subscriptions page: feed list and the OPML controls.
  - navigate: { route: subscriptions }
  - wait_for: { id: feeds-count }
  - assert_visible: { id: opml-export }
  - screenshot: subscriptions
