name: day-news-list-preview-lines
description: Preview preferences rebuild visible rows, preserve the reader, and reset together.
flow:
  - wait_for: { id: nav }
  - navigate: { route: all }
  - wait_for: { id: article-row-0 }
  - select: { id: timeline, index: 0 }
  - pause: { secs: 1 }
  - web_eval: { id: reader-web, script: "window.previewMarker = 'preserved'", text: preserved }
  - menu: { key: day-preferences, only_on: [macos-appkit] }
  - navigate: { route: settings, only_on: [ios-uikit] }
  - set_value: { id: list-size-slider, value: 200 }
  - assert_text: { id: list-size-value, key: settings_list_percent, args: { value: 200 } }
  - select: { id: preview-lines-picker, index: 5 }
  - assert_value: { id: preview-lines-picker, value: 5 }
  - close_window: { window: day.preferences, only_on: [macos-appkit] }
  - navigate: { route: all, only_on: [ios-uikit] }
  - wait_for: { id: article-row-0 }
  - screenshot: { name: list-five-preview-lines, only_on: [macos-appkit] }
  - web_eval: { id: reader-web, script: window.previewMarker, text: preserved, only_on: [macos-appkit] }
  - menu: { key: day-preferences, only_on: [macos-appkit] }
  - navigate: { route: settings, only_on: [ios-uikit] }
  - set_value: { id: list-size-slider, value: 70 }
  - assert_text: { id: list-size-value, key: settings_list_percent, args: { value: 70 } }
  - select: { id: preview-lines-picker, index: 0 }
  - assert_value: { id: preview-lines-picker, value: 0 }
  - close_window: { window: day.preferences, only_on: [macos-appkit] }
  - navigate: { route: all, only_on: [ios-uikit] }
  - wait_for: { id: article-row-0 }
  - screenshot: { name: list-no-preview, only_on: [macos-appkit] }
  - menu: { key: day-preferences, only_on: [macos-appkit] }
  - navigate: { route: settings, only_on: [ios-uikit] }
  - tap: { id: reader-reset-styles }
  - assert_value: { id: preview-lines-picker, value: 2 }
  - assert_text: { id: list-size-value, key: settings_list_percent, args: { value: 120 } }
  - assert_text: { id: reader-size-value, key: settings_reader_percent, args: { value: 140 } }
  - close_window: { window: day.preferences, only_on: [macos-appkit] }
  - navigate: { route: all, only_on: [ios-uikit] }
  - wait_for: { id: article-row-0 }
  - screenshot: { name: list-default-preview, only_on: [macos-appkit] }
  - swipe_row: { id: timeline, row: 0, edge: leading, key: mark_unread }
  - navigate: { route: unread }
  - toolbar: { item: mark-all-read }
  - assert_visible: { id: timeline-empty-row }
  - screenshot: { name: list-caught-up-row, only_on: [macos-appkit] }
