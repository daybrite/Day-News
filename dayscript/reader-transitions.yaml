# Start tests/reader-view-server.py with a fresh isolated DAY_DATA_DIR.
name: reader-transitions
description: Full-content transitions, the reader defaults in Settings, and global auto-load inheritance.
flow:
  - dialog_mode: { mode: scripted }
  - toolbar: { item: new_feed }
  - wait_for: { id: feed_url }
  - input: { id: feed_url, text: 'http://127.0.0.1:28761/feed.json' }
  - tap: { id: feed_verify }
  - tap: { id: feed_subscribe }
  - pause: { secs: 2 }
  - wait_for: { id: feed_inline_reader }
  - toggle: { id: feed_inline_reader, value: true }
  - toggle: { id: feed_auto_reader, value: false }
  - navigate: { route: settings/reader }
  - wait_for: { id: inline_reader_picker }
  - assert_visible: { id: auto_reader_picker }
  - toggle: { id: auto_reader_picker, value: true }
  - screenshot: { name: reader-settings-defaults, window: day.preferences }
  - close_window: { window: day.preferences }
  - select: { id: timeline, index: 0 }
  - pause: { secs: 1 }
  - web_eval: { id: reader_web, script: 'document.getElementById("reader-load-full").click(); "loaded"', text: 'loaded' }
  - pause: { secs: 1 }
  - web_eval: { id: reader_web, script: 'document.getElementById("reader-full-slot").hidden', text: 'false' }
  - web_eval: { id: reader_web, script: 'document.getElementById("reader-full-slot").getAnimations().length', text: '0' }
  - web_eval: { id: reader_web, script: 'document.getElementById("reader-load-full").click(); "hiding"', text: 'hiding' }
  - web_eval: { id: reader_web, script: 'document.getElementById("reader-full-slot").hidden', text: 'true' }
  - toolbar: { item: feed_overview }
  - wait_for: { id: feed_auto_reader }
  - assert_value: { id: feed_auto_reader, value: true }
  - select: { id: timeline, index: 0 }
  - pause: { secs: 1 }
  - web_eval: { id: reader_web, script: 'document.getElementById("reader-full-slot").hidden', text: 'false' }
  - web_eval: { id: reader_web, script: 'document.getElementById("reader-load-full").click(); document.getElementById("reader-load-full").click(); "reversed"', text: 'reversed' }
  - pause: { secs: 0.5 }
  - web_eval: { id: reader_web, script: 'document.getElementById("reader-full-slot").hidden', text: 'false' }
  - screenshot: reader-transition-reversed
  - navigate: { route: settings/reader }
  - wait_for: { id: auto_reader_picker }
  - toggle: { id: auto_reader_picker, value: false }
  - close_window: { window: day.preferences }
  - web_eval: { id: reader_web, script: 'document.getElementById("reader-load-full").click(); "hidden"', text: 'hidden' }
  - pause: { secs: 0.5 }
  - toolbar: { item: feed_overview }
  - wait_for: { id: feed_auto_reader }
  - assert_value: { id: feed_auto_reader, value: false }
  - dialog_mode: { mode: native }
