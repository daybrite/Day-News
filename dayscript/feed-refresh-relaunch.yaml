# Reuse the library from feed-refresh.yaml with tests/feed-refresh-server.py still running.
name: feed-cache-relaunch
flow:
  - pause: { secs: 2 }
  - navigate: { route: all }
  - screenshot: icons-after-relaunch
  - toolbar: { item: refresh }
  - pause: { secs: 0.5 }
  - screenshot: updating-after-relaunch
  - pause: { secs: 5 }
  - toolbar: { item: unread_feeds_only, on: true, skip_on: [ios-uikit, android-material] }
  - toolbar: { item: unread_feeds_only, only_on: [ios-uikit, android-material] }
  - screenshot: filter-toolbar-active
  - toolbar: { item: unread_feeds_only, on: false, skip_on: [ios-uikit, android-material] }
  - toolbar: { item: unread_feeds_only, only_on: [ios-uikit, android-material] }
