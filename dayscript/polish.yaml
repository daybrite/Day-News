# Day News polish check — Smart Feeds, unread dots, and sidebar alignment.
#
#     day launch -p macos-gtk --script dayscript/polish.yaml
#
# CONTRACT: expects an imported store (run dayscript/import.yaml first). Screenshots are the
# point: the dot, the sidebar's left edge, and the timeline background are all things an
# assertion cannot see.
name: day-news-polish
description: Smart Feeds section, unread dots, and sidebar alignment.
flow:
  - wait_for: { id: nav }
  - screenshot: sidebar-today

  - navigate: { route: unread }
  - wait_idle:
  - pause: { secs: 1 }
  - screenshot: unread-dots

  - navigate: { route: starred }
  - pause: { secs: 1 }
  - screenshot: starred

  - navigate: { route: today }
  - pause: { secs: 1 }
  - screenshot: today
