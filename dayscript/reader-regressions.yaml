# Requires seed-demo.yaml. Run with DAY_NEWS_DATA_DIR pointing to an isolated store.
name: day-news-reader-regressions
description: Next Unread crosses scopes, clears search, and preserves the loaded reader on flag changes.
flow:
  - wait_for: { id: nav }
  - nav_back: { native: true, only_on: [ios-uikit] }
  - navigate: { route: all }
  - wait_for: { id: article-row-0 }
  - select: { id: timeline, index: 0 }
  - pause: { secs: 1 }
  - nav_back: { native: true, only_on: [ios-uikit, android-mdc] }
  - swipe_row: { id: timeline, row: 0, edge: leading, key: mark_unread }
  - select: { id: timeline, index: 1 }
  - pause: { secs: 1 }
  - nav_back: { native: true, only_on: [ios-uikit, android-mdc] }
  - swipe_row: { id: timeline, row: 1, edge: leading, key: mark_unread }
  - navigate: { route: starred }
  - toolbar: { item: day.search, text: "no-matching-fixture-phrase" }
  - pause: { secs: 1 }
  - toolbar: { item: next-unread }
  - pause: { secs: 2 }
  - assert_text: { id: scope-title, key: nav_all_unread }
  - assert_visible: { id: reader-web }
  - web_eval:
      id: reader-web
      script: "document.getElementById('reader-title').textContent"
      text: "How monarch butterflies find their way to Mexico"
      only_on: [macos-appkit, ios-uikit]
  - assert_focused: { id: timeline, only_on: [macos-appkit] }
  - screenshot: next-unread-cross-scope
  # Preserve deliberately unread current articles; Next Unread skips them.
  - toolbar: { item: read, on: false }
  - toolbar: { item: next-unread }
  - pause: { secs: 2 }
  - web_eval:
      id: reader-web
      script: "document.getElementById('reader-title').textContent"
      text: "Why we only ever see one side of the Moon"
      only_on: [macos-appkit, ios-uikit]
  # A read/star change must not reload the document or reset its scroll position.
  - web_eval:
      id: reader-web
      script: "window.readerRegressionMarker = 'preserved'"
      text: "preserved"
      only_on: [macos-appkit, ios-uikit]
  - toolbar: { item: star, on: true }
  - pause: { secs: 1 }
  - web_eval:
      id: reader-web
      script: "window.readerRegressionMarker"
      text: "preserved"
      only_on: [macos-appkit, ios-uikit]
  - screenshot: reader-actions
  - toolbar: { item: star, on: false }
  - navigate: { route: all }
  - navigate: { route: unread }
  - menu: { id: mark-all-read }
  - pause: { secs: 1 }
  - assert_visible: { id: timeline-empty }
