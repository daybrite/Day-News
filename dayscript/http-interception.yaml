# DAY_NEWS_HTTP_TEST=1 installs a synthetic HTTP handler before the app opens its store.
# Runs after the bundled-feed walkthrough, with no fixture server or external publisher.
name: http-interception
flow:
  - dialog_mode: { mode: scripted }
  # New Feed is on the feeds page (a phone's bottom bar); a phone opens on Today's list.
  - navigate: { route: "" }
  - toolbar: { item: new_feed }
  - wait_for: { id: feed_url }
  - input: { id: feed_url, text: "https://dayscript.invalid/feed.json" }
  - tap: { id: feed_verify }
  - tap: { id: feed_subscribe }
  - wait_for: { id: article_row:0 }
  - toolbar: { item: refresh }
  - wait_for: { id: article_row:0 }
  - screenshot: http-interception
  - dialog_mode: { mode: native }
