# Run tests/feed-refresh-server.py first, with a fresh isolated app data directory.
name: day-news-feed-refresh
description: Conditional refresh, simultaneous updating indicators, icons and unread filtering.
flow:
  - dialog_mode: { mode: scripted }
  # New Feed is on the feeds page (a phone's bottom bar); a phone opens on Today's list.
  - navigate: { route: "" }
  - toolbar: { item: new_feed }
  - wait_for: { id: feed_url }
  - input: { id: feed_url, text: 'http://127.0.0.1:28762/feed/1' }
  - tap: { id: feed_verify }
  - tap: { id: feed_subscribe }
  - pause: { secs: 1 } # Allow the subscription sheet to close before opening the next.
  # Subscribing opens the new feed; New Feed is on the feeds page (a phone's bottom bar).
  - navigate: { route: "" }
  - toolbar: { item: new_feed }
  - wait_for: { id: feed_url }
  - input: { id: feed_url, text: 'http://127.0.0.1:28762/feed/2' }
  - tap: { id: feed_verify }
  - tap: { id: feed_subscribe }
  - pause: { secs: 1 } # Allow the subscription sheet to close before opening the next.
  - navigate: { route: "" }
  - toolbar: { item: new_feed }
  - wait_for: { id: feed_url }
  - input: { id: feed_url, text: 'http://127.0.0.1:28762/feed/3' }
  - tap: { id: feed_verify }
  - tap: { id: feed_subscribe }
  - pause: { secs: 1 } # Allow the subscription sheet to close before opening the next.
  - navigate: { route: "" }
  - toolbar: { item: new_feed }
  - wait_for: { id: feed_url }
  - input: { id: feed_url, text: 'http://127.0.0.1:28762/feed/4' }
  - tap: { id: feed_verify }
  - tap: { id: feed_subscribe }
  - pause: { secs: 1 } # Allow the subscription sheet to close before opening the next.
  - navigate: { route: "" }
  - toolbar: { item: new_feed }
  - wait_for: { id: feed_url }
  - input: { id: feed_url, text: 'http://127.0.0.1:28762/feed/5' }
  - tap: { id: feed_verify }
  - tap: { id: feed_subscribe }
  - pause: { secs: 1 } # Allow the subscription sheet to close before opening the next.
  - navigate: { route: "" }
  - toolbar: { item: new_feed }
  - wait_for: { id: feed_url }
  - input: { id: feed_url, text: 'http://127.0.0.1:28762/feed/6' }
  - tap: { id: feed_verify }
  - tap: { id: feed_subscribe }
  - pause: { secs: 1 } # Allow the subscription sheet to close before opening the next.
  - pause: { secs: 8 }
  - navigate: { route: all }
  - wait_for: { id: article_row:0 }
  - nav_back: { native: true, only_on: [ios-uikit, android-material] }
  - screenshot: cached-feed-icons
  - toolbar: { item: refresh }
  - pause: { secs: 0.5 }
  - screenshot: feeds-updating
  - pause: { secs: 6 }
  - navigate: { route: all }
  - select: { id: timeline, index: 0 }
  - pause: { secs: 1 }
  - nav_back: { native: true, only_on: [ios-uikit, android-material] }
  - nav_back: { native: true, only_on: [ios-uikit, android-material] }
  - toolbar: { item: unread_feeds_only, on: true, skip_on: [ios-uikit, android-material] }
  - toolbar: { item: unread_feeds_only, only_on: [ios-uikit, android-material] }
  - screenshot: unread-feeds-filter
  - web_eval: { id: reader_web, script: 'document.body.textContent', contains: 'Stable original body.', only_on: [macos-appkit] }
  - toolbar: { item: unread_feeds_only, on: false, skip_on: [ios-uikit, android-material] }
  - toolbar: { item: unread_feeds_only, only_on: [ios-uikit, android-material] }
  - menu: { id: unread_feeds_only, only_on: [macos-appkit] }
  - screenshot: unread-feeds-menu-filter
  - menu: { id: unread_feeds_only, only_on: [macos-appkit] }
  - dialog_mode: { mode: native }
