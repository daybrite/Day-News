# Run after inline-reader.yaml, then relaunch the same isolated data store with
# inline-reader-restore.yaml. Preferences are keyed to the fixture feed's stable ID.
name: inline-reader-persist
flow:
  - toolbar: { item: feed_overview }
  - wait_for: { id: feed_auto_reader }
  - toggle: { id: feed_inline_reader, value: true }
  - toggle: { id: feed_auto_reader, value: true }
