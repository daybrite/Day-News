# Start tests/subscription-discovery-server.py with an isolated store.
name: subscription-discovery
description: Direct feeds, HTML/base discovery, HTTP Link headers, ambiguous choice, missing feeds and sidebar reorder.
flow:
  - dialog_mode: { mode: scripted }
  - toolbar: { item: new_feed }
  - wait_for: { id: feed_url }
  - input: { id: feed_url, text: 'http://127.0.0.1:28763/direct.xml' }
  - tap: { id: feed_verify }
  - tap: { id: feed_subscribe }
  - pause: { secs: 1 }
  - assert_text: { id: "sidebar:header%3Afeeds", contains: "/1 feeds" }
  - assert_route: { route: 'feed:1442691631189166321' }
  - wait_for: { id: article_row:0 }
  - toolbar: { item: new_feed }
  - wait_for: { id: feed_url }
  - input: { id: feed_url, text: 'http://127.0.0.1:28763/site' }
  - tap: { id: feed_verify }
  - tap: { id: feed_subscribe }
  - pause: { secs: 1 }
  - assert_text: { id: "sidebar:header%3Afeeds", contains: "/2 feeds" }
  - assert_route: { route: 'feed:2226428218085183488' }
  - wait_for: { id: article_row:0 }
  - toolbar: { item: new_feed }
  - wait_for: { id: feed_url }
  - input: { id: feed_url, text: 'http://127.0.0.1:28763/header' }
  - tap: { id: feed_verify }
  - tap: { id: feed_subscribe }
  - pause: { secs: 1 }
  - assert_text: { id: "sidebar:header%3Afeeds", contains: "/3 feeds" }
  - assert_route: { route: 'feed:7108728110427175209' }
  - wait_for: { id: article_row:0 }
  - toolbar: { item: new_feed }
  - wait_for: { id: feed_url }
  - input: { id: feed_url, text: 'http://127.0.0.1:28763/multi' }
  - tap: { id: feed_verify }
  - assert_presented: {}
  - respond: { button: 1 }
  - tap: { id: feed_subscribe }
  - pause: { secs: 1 }
  - assert_text: { id: "sidebar:header%3Afeeds", contains: "/4 feeds" }
  - assert_route: { route: 'feed:101536170517251688' }
  - wait_for: { id: article_row:0 }
  - screenshot: new-feed-selected
  - toolbar: { item: new_feed }
  - wait_for: { id: feed_url }
  - input: { id: feed_url, text: 'http://127.0.0.1:28763/missing' }
  - tap: { id: feed_verify }
  - assert_text: { id: feed_verification_status, key: subscribe_failed }
  - tap: { id: feed_cancel }
  - assert_text: { id: "sidebar:header%3Afeeds", contains: "/4 feeds" }
  - reorder: { id: nav_reorder_list, from: 6, to: 9 }
  - pause: { secs: 1 }
  - assert_route: { route: 'feed:101536170517251688' }
  - screenshot: reordered-sidebar
  - toolbar: { item: new_feed }
  - wait_for: { id: feed_url }
  - input: { id: feed_url, text: 'file:///tmp/fixture.xml' }
  - tap: { id: feed_verify }
  - assert_text: { id: feed_verification_status, key: subscribe_failed }
  - tap: { id: feed_cancel }
  - assert_text: { id: "sidebar:header%3Afeeds", contains: "/4 feeds" }
  - toolbar: { item: unread_feeds_only, on: true }
  - toolbar: { item: new_feed }
  - wait_for: { id: feed_url }
  - input: { id: feed_url, text: 'http://127.0.0.1:28763/empty.xml' }
  - tap: { id: feed_verify }
  - tap: { id: feed_subscribe }
  - pause: { secs: 1 }
  - assert_route: { route: 'feed:8308222376836992429' }
  - assert_text: { id: dashboard_title, text: Fixture Empty }
  - screenshot: empty-feed-selected
  - dialog_mode: { mode: native }
