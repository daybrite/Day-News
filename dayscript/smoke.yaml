# Network-free smoke check against the real Day News navigation, with or without feeds.
name: day-news-smoke
description: Library overview and preferences mount without any subscriptions.
flow:
  - wait_for: { id: nav }
  - navigate: { route: all }
  - assert_route: { route: all }
  - toolbar: { item: feed-overview }
  - wait_for: { id: dashboard-title }
  - assert_text: { id: dashboard-title, key: nav_all_articles }
  - screenshot: smoke
  - menu: { key: day-preferences, only_on: [macos-appkit, macos-gtk, macos-qt, linux-gtk, linux-qt, windows-winui, windows-xaml] }
  - navigate: { route: settings, only_on: [ios-uikit, android-mdc, harmony-arkui, web-dom] }
  - wait_for: { id: language-picker }
  - assert_visible: { id: refresh-interval-picker }
  - close_window: { window: day.preferences, only_on: [macos-appkit, macos-gtk, macos-qt, linux-gtk, linux-qt, windows-winui, windows-xaml] }
