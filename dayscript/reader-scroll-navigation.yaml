# Start tests/reader-view-server.py 28763 with a fresh isolated DAY_DATA_DIR.
name: reader-scroll-navigation
description: New articles start at the top; flags and retained mobile pages preserve scroll.
flow:
  - dialog_mode: { mode: scripted }
  # New Feed is on the feeds page (a phone's bottom bar); a phone opens on Today's list.
  - navigate: { route: "" }
  - toolbar: { item: new_feed }
  - wait_for: { id: feed_url }
  - input: { id: feed_url, text: 'http://127.0.0.1:28763/scroll-feed.json' }
  - tap: { id: feed_verify }
  - tap: { id: feed_subscribe }
  - pause: { secs: 2 }
  - toolbar: { item: feed_overview }
  - wait_for: { id: feed_inline_reader }
  - toggle: { id: feed_inline_reader, value: true }
  - toggle: { id: feed_auto_reader, value: false }
  - select: { id: timeline, index: 0 }
  - pause: { secs: 1 }
  - web_eval: { id: reader_web, script: 'document.getElementById("reader-title").textContent', text: complete }
  - web_eval: { id: reader_web, script: 'window.scrollTo(0, 600); window.scrollMarker = "retained"', text: retained }
  - pause: { secs: 0.3 }
  - web_eval: { id: reader_web, script: 'scrollY > 500', text: 'true' }
  - toolbar: { item: star, on: true }
  - pause: { secs: 0.5 }
  - web_eval: { id: reader_web, script: 'window.scrollMarker === "retained" && scrollY > 500', text: 'true' }
  # This command is shared by the toolbar and Cmd-/.
  - toolbar: { item: next_unread }
  - pause: { secs: 1 }
  - web_eval: { id: reader_web, script: 'document.getElementById("reader-title").textContent', text: slow }
  - web_eval: { id: reader_web, script: 'scrollY', text: '0' }
  - screenshot: reader-next-unread-top
  - web_eval: { id: reader_web, script: 'window.scrollTo(0, 600); "scrolled"', text: scrolled }
  - pause: { secs: 0.3 }
  - web_eval: { id: reader_web, script: 'scrollY > 500', text: 'true' }
  - toolbar: { item: next_article }
  - pause: { secs: 1 }
  - web_eval: { id: reader_web, script: 'document.getElementById("reader-title").textContent', text: denied }
  - web_eval: { id: reader_web, script: 'scrollY', text: '0' }
  - web_eval: { id: reader_web, script: 'window.scrollTo(0, 600); "scrolled"', text: scrolled }
  - pause: { secs: 0.3 }
  - web_eval: { id: reader_web, script: 'scrollY > 500', text: 'true' }
  - toolbar: { item: previous_article }
  - pause: { secs: 1 }
  - web_eval: { id: reader_web, script: 'document.getElementById("reader-title").textContent', text: slow }
  - web_eval: { id: reader_web, script: 'scrollY', text: '0', only_on: [macos-appkit, macos-gtk, macos-qt, linux-gtk, linux-qt, windows-winui, windows-xaml, web-dom] }
  - web_eval: { id: reader_web, script: 'scrollY > 500', text: 'true', only_on: [ios-uikit, android-material, harmony-arkui] }
  - web_eval: { id: reader_web, script: 'window.scrollTo(0, 600); "scrolled"', text: scrolled }
  - pause: { secs: 0.3 }
  - web_eval: { id: reader_web, script: 'scrollY > 500', text: 'true' }
  - select: { id: timeline, index: 0 }
  - pause: { secs: 1 }
  - web_eval: { id: reader_web, script: 'document.getElementById("reader-title").textContent', text: complete }
  - web_eval: { id: reader_web, script: 'scrollY', text: '0' }
  - screenshot: reader-selected-top
  - dialog_mode: { mode: native }
