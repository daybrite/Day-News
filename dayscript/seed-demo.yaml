# Seeds the store from the bundled demo feeds: the deterministic, network-free articles the
# walkthrough's contract needs (its steps read "All Articles" and drive the read/star/tag flows,
# so the store must already hold subscriptions with articles).
#
# The seven feeds live under resource/assets/demo/<locale>/ and ship inside the app; the README
# there describes each one. An `asset:demo/…` URL names a feed without its language: the app reads
# the set for the locale it is running in, falling back to English (daynews-core `preview_feed`),
# so a run under `--locale` shows that language's articles wherever the app has a set for it. No
# live feed and no network, so it runs identically on every platform and on a fresh CI runner.
#
# Between them the feeds cover RSS 2.0 with full bodies, summary-only RSS, escaped and CDATA HTML
# descriptions, Atom, RSS 1.0 (RDF) and a JSON Feed microblog whose posts carry no titles, so the
# timeline's derived-title path stays covered.
#
# CONTRACT: expects a store with no other subscriptions (the count is the whole sidebar); CI
# runners start empty. On a store already seeded, each New Feed meets the Already Subscribed
# question instead (src/subscriptions.rs `already_subscribed`), so run it on an empty one.
name: day-news-seed-demo
description: Subscribe to the bundled demo feeds — the offline seed for the walkthrough.
flow:
  - dialog_mode: { mode: scripted }
  - wait_for: { id: nav, timeout_secs: 30 }
  # New Feed is on the feeds page (a phone's bottom bar); a phone opens on Today's list.
  - navigate: { route: "" }
  - toolbar: { item: new_feed }
  - wait_for: { id: feed_url }
  - input: { id: feed_url, text: "asset:demo/field-notes.xml" }
  - tap: { id: feed_verify }
  - tap: { id: feed_subscribe }
  - pause: { secs: 1 }
  # Subscribing opens the new feed; New Feed is on the feeds page (a phone's bottom bar).
  - navigate: { route: "" }
  - toolbar: { item: new_feed }
  - wait_for: { id: feed_url }
  - input: { id: feed_url, text: "asset:demo/night-sky.xml" }
  - tap: { id: feed_verify }
  - tap: { id: feed_subscribe }
  - pause: { secs: 1 }
  - navigate: { route: "" }
  - toolbar: { item: new_feed }
  - wait_for: { id: feed_url }
  - input: { id: feed_url, text: "asset:demo/kitchen-science.xml" }
  - tap: { id: feed_verify }
  - tap: { id: feed_subscribe }
  - pause: { secs: 1 }
  - navigate: { route: "" }
  - toolbar: { item: new_feed }
  - wait_for: { id: feed_url }
  - input: { id: feed_url, text: "asset:demo/atlas.xml" }
  - tap: { id: feed_verify }
  - tap: { id: feed_subscribe }
  - pause: { secs: 1 }
  - navigate: { route: "" }
  - toolbar: { item: new_feed }
  - wait_for: { id: feed_url }
  - input: { id: feed_url, text: "asset:demo/word-of-the-day.xml" }
  - tap: { id: feed_verify }
  - tap: { id: feed_subscribe }
  - pause: { secs: 1 }
  - navigate: { route: "" }
  - toolbar: { item: new_feed }
  - wait_for: { id: feed_url }
  - input: { id: feed_url, text: "asset:demo/workshop.xml" }
  - tap: { id: feed_verify }
  - tap: { id: feed_subscribe }
  - pause: { secs: 1 }
  - navigate: { route: "" }
  - toolbar: { item: new_feed }
  - wait_for: { id: feed_url }
  - input: { id: feed_url, text: "asset:demo/almanac.json" }
  - tap: { id: feed_verify }
  - tap: { id: feed_subscribe }
  - pause: { secs: 2 }
  # Native sidebars (the phones' and AppKit's outline) do not expose section headers as Day
  # elements. Match the walkthrough's feed-count assertions; the article list below is portable.
  - assert_text: { id: "sidebar:header%3Afeeds", contains: "(7)", skip_on: [ios-uikit, android-material, harmony-arkui, macos-appkit] }
  - navigate: { route: all }
  - wait_for: { id: article_row:0, timeout_secs: 20 }
  - screenshot: seeded-demo
  - dialog_mode: { mode: native }
