# Subscribes to a handful of dependable live feeds, for a device where importing a file is
# awkward. They are the originals of the parser's captured fixtures
# (crates/daynews-feed/tests/data/README.md), and each is a different flavour (WordPress, plain
# RSS 2.0, Discourse, Atom, Mastodon), so the parser's breadth is visible on the device too. For
# the offline demo articles the screenshots use, run dayscript/seed-demo.yaml instead.
name: day-news-seed
description: Subscribe to a few representative feeds and let them refresh.
flow:
  - dialog_mode: { mode: scripted }
  - wait_for: { id: nav, timeout_secs: 30 }
  - toolbar: { item: new-feed }
  - wait_for: { id: feed-url }
  - input: { id: feed-url, text: "https://www.nasa.gov/feed/" }
  - tap: { id: feed-verify }
  - tap: { id: feed-subscribe }
  - pause: { secs: 2 }
  - toolbar: { item: new-feed }
  - wait_for: { id: feed-url }
  - input: { id: feed-url, text: "https://www.quantamagazine.org/feed/" }
  - tap: { id: feed-verify }
  - tap: { id: feed-subscribe }
  - pause: { secs: 2 }
  - toolbar: { item: new-feed }
  - wait_for: { id: feed-url }
  - input: { id: feed-url, text: "https://www.sciencedaily.com/rss/all.xml" }
  - tap: { id: feed-verify }
  - tap: { id: feed-subscribe }
  - pause: { secs: 2 }
  - toolbar: { item: new-feed }
  - wait_for: { id: feed-url }
  - input: { id: feed-url, text: "https://www.merriam-webster.com/wotd/feed/rss2" }
  - tap: { id: feed-verify }
  - tap: { id: feed-subscribe }
  - pause: { secs: 2 }
  - toolbar: { item: new-feed }
  - wait_for: { id: feed-url }
  - input: { id: feed-url, text: "https://users.rust-lang.org/c/announcements/6.rss" }
  - tap: { id: feed-verify }
  - tap: { id: feed-subscribe }
  - pause: { secs: 2 }
  - toolbar: { item: new-feed }
  - wait_for: { id: feed-url }
  - input: { id: feed-url, text: "https://blog.rust-lang.org/feed.xml" }
  - tap: { id: feed-verify }
  - tap: { id: feed-subscribe }
  - pause: { secs: 2 }
  - toolbar: { item: new-feed }
  - wait_for: { id: feed-url }
  - input: { id: feed-url, text: "https://social.rust-lang.org/@rust.rss" }
  - tap: { id: feed-verify }
  - tap: { id: feed-subscribe }
  - pause: { secs: 4 }
  - assert_text: { id: feeds-count, text: "7 feeds" }
  - navigate: { route: unread }
  - pause: { secs: 3 }
  - screenshot: seeded
  - dialog_mode: { mode: native }
