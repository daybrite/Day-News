# Start tests/feed-refresh-server.py and use a fresh DAY_NEWS_DATA_DIR.
# /stats must show rotating=4, busy=1, modified=2, unchanged=2, invalid_conditions=0.
name: day-news-conditional-cache
description: Identical 200 rotates validators, following 304 avoids imports, Retry-After suppresses polls.
flow:
  - dialog_mode: { mode: scripted }
  - toolbar: { item: new-feed }
  - assert_presented: {}
  - respond: { text: 'http://127.0.0.1:28762/cache/rotating' }
  - toolbar: { item: new-feed }
  - assert_presented: {}
  - respond: { text: 'http://127.0.0.1:28762/cache/busy' }
  - pause: { secs: 2 }
  - navigate: { route: all }
  - wait_for: { id: article-row-0 }
  - toolbar: { item: refresh }
  - pause: { secs: 2 }
  - toolbar: { item: refresh }
  - pause: { secs: 2 }
  - toolbar: { item: refresh }
  - pause: { secs: 2 }
  - select: { id: timeline, index: 0 }
  - pause: { secs: 1 }
  - web_eval: { id: reader-web, script: 'document.body.textContent', contains: 'Stable original body.', only_on: [macos-appkit] }
  - screenshot: conditional-cache
  - dialog_mode: { mode: native }
