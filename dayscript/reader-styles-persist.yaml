name: day-news-reader-styles-persist
description: Save reader choices; follow with reader-styles-restore.yaml in a new process.
flow:
  # On a phone or the web the section is a root list of groups: open it and tap the group's
  # row (`settings/<group>` is the desktop window's route to a tab).
  - navigate: { route: settings/articles, skip_on: [ios-uikit, android-material, harmony-arkui, web-dom] }
  - navigate: { route: settings, only_on: [web-dom] }
  - toolbar: { item: settings, only_on: [ios-uikit, android-material, harmony-arkui] }
  - tap: { id: prefs_group:articles, only_on: [ios-uikit, android-material, harmony-arkui, web-dom] }
  - wait_for: { id: preview_lines_picker }
  - select: { id: preview_lines_picker, index: 3 }
  # Slider values are driven where the row's id is on the control itself; the UIKit, ArkUI
  # GTK and XAML settings rows put it on the layout wrapper, which a probe cannot read.
  - set_value: { id: list_size_slider, value: 170, skip_on: [ios-uikit, harmony-arkui, linux-gtk, macos-gtk, windows-winui] }
  - navigate: { route: settings/reader, skip_on: [ios-uikit, android-material, harmony-arkui, web-dom] }
  - nav_back: { only_on: [ios-uikit, android-material, harmony-arkui, web-dom] }
  - tap: { id: prefs_group:reader, only_on: [ios-uikit, android-material, harmony-arkui, web-dom] }
  - wait_for: { id: reader_size_slider }
  - set_value: { id: reader_size_slider, value: 160, skip_on: [ios-uikit, harmony-arkui, linux-gtk, macos-gtk, windows-winui] }
  - select: { id: reader_font_picker, index: 1 }
  - input: { id: reader_background_color, text: '#fff2d5' }
  - input: { id: reader_text_color, text: '#243448' }
  - close_window: { window: day.preferences, only_on: [ios-uikit, android-material, harmony-arkui, macos-appkit] }
