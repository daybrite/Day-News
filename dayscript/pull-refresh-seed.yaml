name: pull-refresh-seed
description: Seed an isolated library for native pull-to-refresh gestures using the local fixture server.
flow:
  # New Feed is on the feeds page (a phone's bottom bar); a phone opens on Today's list.
  - navigate: { route: "" }
  - toolbar: { item: new_feed }
  - wait_for: { id: feed_url }
  - input: { id: feed_url, text: 'http://127.0.0.1:28762/progress/known' }
  - tap: { id: feed_verify }
  - pause: { secs: 8 } # The synthetic response deliberately streams for six seconds.
  - wait_for: { id: feed_subscribe }
  - tap: { id: feed_subscribe }
  - pause: { secs: 8 }
  - navigate: { route: all }
  - wait_for: { id: article_row:0 }
  - nav_back: { native: true }
  - toolbar: { item: refresh }
  - navigate: { route: starred }
  - assert_text: { id: timeline_empty, key: timeline_synchronizing }
  - screenshot: empty-while-synchronizing
  - pause: { secs: 8 }
  - assert_text: { id: timeline_empty, key: timeline_empty }
  - nav_back: { native: true }
  - screenshot: pull-refresh-root
