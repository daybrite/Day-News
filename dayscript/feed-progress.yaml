# Start tests/feed-refresh-server.py and use an isolated DAY_NEWS_DATA_DIR.
name: day-news-feed-progress
flow:
  - dialog_mode: { mode: scripted }
  - toolbar: { item: new_feed }
  - wait_for: { id: feed_url }
  - input: { id: feed_url, text: 'http://127.0.0.1:28762/progress/known' }
  - tap: { id: feed_verify }
  - tap: { id: feed_subscribe }
  - toolbar: { item: new_feed }
  - wait_for: { id: feed_url }
  - input: { id: feed_url, text: 'http://127.0.0.1:28762/progress/unknown' }
  - tap: { id: feed_verify }
  - tap: { id: feed_subscribe }
  - pause: { secs: 9 }
  - navigate: { route: all }
  - nav_back: { native: true, only_on: [ios-uikit] }
  - screenshot: feed-progress-idle
  - toolbar: { item: refresh }
  - pause: { secs: 0.5 }
  - screenshot: feed-progress-connecting
  - pause: { secs: 3 }
  - screenshot: feed-progress-downloading
  - pause: { secs: 4 }
  - screenshot: feed-progress-finished
  - dialog_mode: { mode: native }
