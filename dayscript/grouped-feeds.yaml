# Run after seed-demo.yaml in an isolated store.
name: day-news-grouped-feeds
description: Group headings, floating title and persistent feed priority.
flow:
  - menu: { key: day-preferences, only_on: [macos-appkit, macos-gtk, macos-qt, linux-gtk, linux-qt, windows-winui, windows-xaml] }
  - navigate: { route: settings, only_on: [ios-uikit, android-mdc, harmony-arkui, web-dom] }
  - wait_for: { id: group-by-feeds-picker }
  - toggle: { id: group-by-feeds-picker, value: true }
  - select: { id: refresh-interval-picker, index: 0 }
  - close_window: { window: day.preferences, only_on: [macos-appkit, macos-gtk, macos-qt, linux-gtk, linux-qt, windows-winui, windows-xaml] }
  - navigate: { route: all }
  - wait_for: { id: floating-feed-name }
  - screenshot: grouped-feeds
  - reorder: { id: nav-reorder-list, from: 8, to: 6 }
  - pause: { secs: 1 }
  - navigate: { route: all }
  - wait_for: { id: floating-feed-name }
  - assert_text: { id: floating-feed-name, text: Kitchen Science }
  - screenshot: reordered-feed-groups
  - select: { id: timeline, index: 30 }
  - pause: { secs: 1 }
  - screenshot: floating-feed-header
  - reorder: { id: nav-reorder-list, from: 6, to: 8 }
  - pause: { secs: 1 }
  - menu: { key: day-preferences, only_on: [macos-appkit, macos-gtk, macos-qt, linux-gtk, linux-qt, windows-winui, windows-xaml] }
  - navigate: { route: settings, only_on: [ios-uikit, android-mdc, harmony-arkui, web-dom] }
  - toggle: { id: group-by-feeds-picker, value: false }
  - close_window: { window: day.preferences, only_on: [macos-appkit, macos-gtk, macos-qt, linux-gtk, linux-qt, windows-winui, windows-xaml] }
