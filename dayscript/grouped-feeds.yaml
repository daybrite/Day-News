# Desktop regression: run after seed-demo.yaml in an isolated store.
# Mobile navigation sidebars intentionally omit drag reordering.
name: day-news-grouped-feeds
description: Group headings, floating title and persistent feed priority.
flow:
  # On a phone or the web the section is a root list of groups: open it and tap the group's
  # row (`settings/<group>` is the desktop window's route to a tab).
  - navigate: { route: settings/articles, skip_on: [ios-uikit, android-mdc, harmony-arkui, web-dom] }
  - navigate: { route: settings, only_on: [web-dom] }
  - toolbar: { item: settings, only_on: [ios-uikit, android-mdc, harmony-arkui] }
  - tap: { id: prefs-group-articles, only_on: [ios-uikit, android-mdc, harmony-arkui, web-dom] }
  - wait_for: { id: group-by-feeds-picker }
  - toggle: { id: group-by-feeds-picker, value: true }
  - navigate: { route: settings/feeds, skip_on: [ios-uikit, android-mdc, harmony-arkui, web-dom] }
  - nav_back: { only_on: [ios-uikit, android-mdc, harmony-arkui, web-dom] }
  - tap: { id: prefs-group-feeds, only_on: [ios-uikit, android-mdc, harmony-arkui, web-dom] }
  - wait_for: { id: refresh-interval-picker }
  - select: { id: refresh-interval-picker, index: 0 }
  - close_window: { window: day.preferences, only_on: [ios-uikit, android-mdc, harmony-arkui, macos-appkit, macos-gtk, macos-qt, linux-gtk, linux-qt, windows-winui] }
  - navigate: { route: all }
  - wait_for: { id: article-row-0 }
  - assert_missing: { id: floating-feed-name }
  - screenshot: grouped-feeds
  - reorder: { id: nav-reorder-list, from: 8, to: 6 }
  - pause: { secs: 1 }
  - navigate: { route: all }
  - wait_for: { id: article-row-0 }
  - assert_text: { id: article-row-0, contains: What makes bread rise }
  - screenshot: reordered-feed-groups
  - select: { id: timeline, index: 30 }
  - pause: { secs: 1 }
  - wait_for: { id: floating-feed-name }
  - screenshot: floating-feed-header
  - reorder: { id: nav-reorder-list, from: 6, to: 8 }
  - pause: { secs: 1 }
  - navigate: { route: settings/articles, skip_on: [ios-uikit, android-mdc, harmony-arkui, web-dom] }
  - navigate: { route: settings, only_on: [web-dom] }
  - toolbar: { item: settings, only_on: [ios-uikit, android-mdc, harmony-arkui] }
  - tap: { id: prefs-group-articles, only_on: [ios-uikit, android-mdc, harmony-arkui, web-dom] }
  - wait_for: { id: group-by-feeds-picker }
  - toggle: { id: group-by-feeds-picker, value: false }
  - close_window: { window: day.preferences, only_on: [ios-uikit, android-mdc, harmony-arkui, macos-appkit, macos-gtk, macos-qt, linux-gtk, linux-qt, windows-winui] }
