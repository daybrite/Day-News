# Run with DAY_NEWS_SYNC_TEST=1 and a fresh DAY_DATA_DIR.
# The synthetic server intercepts the production day-part-http client.
name: feedbin-sync
description: Native account login, preview, article import and reading.
flow:
  - navigate: { route: settings/accounts, skip_on: [ios-uikit, android-material, harmony-arkui, web-dom] }
  - toolbar: { item: settings, only_on: [ios-uikit, android-material, harmony-arkui] }
  - tap: { id: prefs_group:accounts, only_on: [ios-uikit, android-material, harmony-arkui] }
  - wait_for: { id: sync_username, skip_on: [web-dom] }
  - screenshot: { name: sync-login, window: day.preferences, skip_on: [ios-uikit, android-material, harmony-arkui, web-dom] }
  - screenshot: { name: sync-login, only_on: [ios-uikit, android-material, harmony-arkui] }
  - input: { id: sync_username, text: fixture@example.invalid, skip_on: [web-dom] }
  - input: { id: sync_password, text: fixture-password, skip_on: [web-dom] }
  - tap: { id: sync_sign_in, skip_on: [web-dom] }
  - wait_for: { id: sync_preview, skip_on: [web-dom] }
  - screenshot: { name: sync-preview, window: day.preferences, skip_on: [ios-uikit, android-material, harmony-arkui, web-dom] }
  - screenshot: { name: sync-preview, only_on: [ios-uikit, android-material, harmony-arkui] }
  - tap: { id: sync_connect, skip_on: [web-dom] }
  - wait_for: { id: sync_account, skip_on: [web-dom] }
  - pause: { secs: 3, skip_on: [web-dom] }
  - assert_text: { id: sync_status, key: sync_ready, timeout_secs: 25, skip_on: [web-dom] }
  - screenshot: { name: sync-connected, window: day.preferences, skip_on: [ios-uikit, android-material, harmony-arkui, web-dom] }
  - screenshot: { name: sync-connected, only_on: [ios-uikit, android-material, harmony-arkui] }
  - close_window: { window: day.preferences, skip_on: [web-dom] }
  - navigate: { route: "feed:3155635484843577116", skip_on: [web-dom] }
  - wait_for: { id: article_row:0, skip_on: [web-dom] }
  - screenshot: { name: sync-articles, skip_on: [web-dom] }
  - select: { id: timeline, index: 0, skip_on: [web-dom] }
  - wait_for: { id: reader_web, skip_on: [web-dom] }
  - screenshot: { name: sync-reader, skip_on: [web-dom] }
  # iOS uses a plain command: its circle changes with the stored read state,
  # without UIKit's selected bar-button background.
  - toolbar: { item: read, only_on: [ios-uikit] }
  - pause: { secs: 1, only_on: [ios-uikit] }
  - screenshot: { name: sync-reader-unread, only_on: [ios-uikit] }
  - toolbar: { item: read, only_on: [ios-uikit] }
  - pause: { secs: 1, only_on: [ios-uikit] }
  - screenshot: { name: sync-reader-read, only_on: [ios-uikit] }
